name: Arletion CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: arletion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Type check
        run: npm --prefix apps/web run typecheck
      - name: Frontend tests
        run: npm --prefix apps/web test
      - name: Production build
        run: npm --prefix apps/web run build

  api:
    name: API tests with isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arletion_test
          POSTGRES_PASSWORD: arletion_test_password
          POSTGRES_DB: arletion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arletion_test -d arletion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://arletion_test:arletion_test_password@127.0.0.1:5432/arletion_test
      ARLETION_TEST_DATABASE_URL: postgresql+psycopg://arletion_test:arletion_test_password@127.0.0.1:5432/arletion_test
      ARLETION_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ARLETION_REQUIRE_API_KEY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
        working-directory: services/api
      - name: Compile API
        run: python -m compileall -q app migrations tests
        working-directory: services/api
      - name: Apply migrations
        run: python -m alembic upgrade head
        working-directory: services/api
      - name: Verify repeat migration is safe
        run: python -m alembic upgrade head
        working-directory: services/api
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
        working-directory: services/api

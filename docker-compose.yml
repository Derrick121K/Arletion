services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arletion}
      POSTGRES_USER: ${POSTGRES_USER:-arletion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5432:5432"]
    volumes:
      - arletion_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arletion} -d ${POSTGRES_DB:-arletion}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://arletion:change-this-local-password@db:5432/arletion}
      ARLETION_CORS_ORIGINS: ${ARLETION_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ARLETION_REQUIRE_API_KEY: ${ARLETION_REQUIRE_API_KEY:-true}
      ARLETION_API_KEY: ${ARLETION_API_KEY:-change-this-local-api-key}
      ARLETION_DEMO_MODE: "false"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      ARLETION_API_BASE_URL: http://api:8000
      ARLETION_API_KEY: ${ARLETION_API_KEY:-change-this-local-api-key}
      ARLETION_BASIC_AUTH_USER: ${ARLETION_BASIC_AUTH_USER:-local-admin}
      ARLETION_BASIC_AUTH_PASSWORD: ${ARLETION_BASIC_AUTH_PASSWORD:-change-this-local-basic-auth-password}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  arletion_db:

# Arletion private preview. This free-tier database is temporary: Render Free
# Postgres expires after 30 days and has no backups. Do not store client/consumer
# data here. Upgrade or use a durable managed PostgreSQL service before production.
previews:
  generation: off

services:
  - type: web
    name: arletion-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: arletion-db
          property: connectionString
      - key: ARLETION_REQUIRE_API_KEY
        value: "true"
      - key: ARLETION_API_KEY
        generateValue: true
      - key: ARLETION_CORS_ORIGINS
        value: https://arletion-web.onrender.com

  - type: web
    name: arletion-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run lint && npm run typecheck && npm test && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: ARLETION_API_BASE_URL
        fromService:
          type: web
          name: arletion-api
          property: hostport
      - key: ARLETION_API_KEY
        fromService:
          type: web
          name: arletion-api
          envVarKey: ARLETION_API_KEY
      - key: ARLETION_BASIC_AUTH_USER
        sync: false
      - key: ARLETION_BASIC_AUTH_PASSWORD
        sync: false

databases:
  - name: arletion-db
    databaseName: arletion
    user: arletion
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
